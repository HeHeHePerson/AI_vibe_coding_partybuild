{% extends "base.html" %}

{% block title %}用户登录 - 智慧党建系统{% endblock %}

{% block content %}
<div class="form-container">
    <h1>用户登录</h1>
    <form id="loginForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required placeholder="请输入密码（至少8位，含数字和大小写）">
        </div>
        <div class="form-group captcha-group">
            <div class="captcha-display" id="captchaDisplay">
                <span class="captcha-loading">加载中...</span>
            </div>
            <input type="text" id="captcha" name="captcha" required placeholder="请输入计算结果" maxlength="3">
            <button type="button" class="btn btn-sm" onclick="refreshCaptcha()">刷新</button>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">登录</button>
        </div>
    </form>
    <div class="form-footer">
        <p>还没有账号？<a href="/register">立即注册</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
.captcha-group {
    display: flex;
    align-items: center;
    gap: 10px;
}
.captcha-display {
    background: #f5f5f5;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    min-width: 100px;
    text-align: center;
}
.captcha-display .captcha-loading {
    font-size: 14px;
    font-weight: normal;
    color: #999;
}
#captcha {
    flex: 1;
    max-width: 120px;
}
</style>
<script>
async function refreshCaptcha() {
    const result = await utils.api('/api/auth/captcha');
    if (result.code === 200) {
        document.getElementById('captchaDisplay').textContent = result.data.expression;
    }
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const captcha = document.getElementById('captcha').value.trim();
    auth.login(username, password, captcha);
});

document.addEventListener('DOMContentLoaded', function() {
    refreshCaptcha();
});
</script>
{% endblock %}
