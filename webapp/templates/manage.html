{% extends "base.html" %}

{% block title %}用户管理 - 智慧党建系统{% endblock %}

{% block content %}
<div class="manage-header">
    <h1>用户管理</h1>
    <button class="btn btn-primary" onclick="showAddUserModal()">新增用户</button>
</div>

<div class="user-table">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>角色</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr>
                <td colspan="5" style="text-align:center;">加载中...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- 新增用户弹框 -->
<div class="modal" id="addUserModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>新增用户</h3>
        </div>
        <form id="addUserForm">
            <div class="form-group">
                <label for="newUsername">用户名</label>
                <input type="text" id="newUsername" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="newPassword">密码</label>
                <input type="password" id="newPassword" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="newRole">角色</label>
                <select id="newRole">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeAddUserModal()">取消</button>
                <button type="submit" class="btn btn-primary">创建</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function showAddUserModal() {
    document.getElementById('addUserModal').classList.add('show');
}

function closeAddUserModal() {
    document.getElementById('addUserModal').classList.remove('show');
}

document.getElementById('addUserForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const role = document.getElementById('newRole').value;

    userManage.createUser(username, password, role);
});

document.addEventListener('DOMContentLoaded', function() {
    auth.checkAuth().then(function() {
        userManage.getUsers();
    });
});
</script>
{% endblock %}
