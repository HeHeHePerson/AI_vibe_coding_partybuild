{% extends "base.html" %}

{% block title %}党建知识学习 - 智慧党建系统{% endblock %}

{% block content %}
    <div class="party-knowledge-page">
        <h1 class="page-title">党建知识学习</h1>
        
        <!-- 操作栏 -->
        <div class="action-bar">
            <button id="createKnowledgeBtn" class="btn btn-primary">新建党建知识</button>
            <div class="category-filter">
                <select id="categorySelect" class="form-control">
                    <option value="">全部分类</option>
                    <!-- 分类选项将通过JavaScript动态添加 -->
                </select>
            </div>
        </div>
        
        <!-- 新建党建知识模态框 -->
        <div id="createKnowledgeModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>新建党建知识</h3>
                    <button class="close-btn" onclick="partyKnowledge.closeCreateModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="createKnowledgeForm">
                        <div class="form-group">
                            <label for="knowledgeTitle">标题</label>
                            <input type="text" id="knowledgeTitle" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="knowledgeCategory">分类</label>
                            <input type="text" id="knowledgeCategory" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="knowledgeContent">内容</label>
                            <textarea id="knowledgeContent" class="form-control" rows="8" required></textarea>
                        </div>
                        <div class="form-group" id="reviewNotice" style="display: none;">
                            <div class="alert alert-info">
                                提示：您的内容需要管理员审核后才能发布
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="partyKnowledge.closeCreateModal()">取消</button>
                    <button class="btn btn-primary" onclick="partyKnowledge.createKnowledge()">保存</button>
                </div>
            </div>
        </div>
        
        <!-- 知识列表 -->
        <div class="content-list" id="knowledgeList">
            <!-- 知识项将通过JavaScript动态添加 -->
            <div class="loading">加载中...</div>
        </div>
        
        <!-- 分页 -->
        <div class="pagination" id="pagination">
            <!-- 分页控件将通过JavaScript动态添加 -->
        </div>
    </div>
{% endblock %}

{% block extra_js %}
<script>
// 党建知识模块
const partyKnowledge = {
    currentPage: 1,
    currentCategory: '',
    
    init: function() {
        this.loadCategories();
        this.loadKnowledgeList();
        
        // 分类筛选事件
        document.getElementById('categorySelect').addEventListener('change', (e) => {
            this.currentCategory = e.target.value;
            this.currentPage = 1;
            this.loadKnowledgeList();
        });
        
        // 新建按钮事件
        document.getElementById('createKnowledgeBtn').addEventListener('click', () => {
            this.openCreateModal();
        });
        
        // 检查用户权限，显示或隐藏新建按钮
        this.checkPermissions();
    },
    
    checkPermissions: function() {
        if (!currentUser) {
            document.getElementById('createKnowledgeBtn').style.display = 'none';
        } else {
            document.getElementById('createKnowledgeBtn').style.display = 'inline-block';
            
            // 对于非管理员用户，显示审核提示
            if (currentUser.role !== 'admin') {
                document.getElementById('reviewNotice').style.display = 'block';
            }
        }
    },
    
    openCreateModal: function() {
        document.getElementById('createKnowledgeModal').style.display = 'flex';
    },
    
    closeCreateModal: function() {
        document.getElementById('createKnowledgeModal').style.display = 'none';
        document.getElementById('createKnowledgeForm').reset();
    },
    
    createKnowledge: async function() {
        const title = document.getElementById('knowledgeTitle').value.trim();
        const category = document.getElementById('knowledgeCategory').value.trim();
        const content = document.getElementById('knowledgeContent').value.trim();
        
        if (!title || !category || !content) {
            utils.showToast('请填写完整信息', 'error');
            return;
        }
        
        const result = await utils.api('/api/party/knowledge', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: title,
                category: category,
                content: content
            })
        });
        
        if (result.code === 200) {
            utils.showToast('创建成功', 'success');
            this.closeCreateModal();
            this.loadKnowledgeList();
        } else {
            utils.showToast(result.message || '创建失败', 'error');
        }
    },
    
    loadCategories: async function() {
        const result = await utils.api('/api/party/knowledge/categories');
        if (result.code === 200) {
            const select = document.getElementById('categorySelect');
            result.data.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        }
    },
    
    loadKnowledgeList: async function() {
        const listContainer = document.getElementById('knowledgeList');
        listContainer.innerHTML = '<div class="loading">加载中...</div>';
        
        const result = await utils.api(`/api/party/knowledge?category=${encodeURIComponent(this.currentCategory)}&page=${this.currentPage}&per_page=10`);
        if (result.code === 200) {
            this.renderKnowledgeList(result.data.list, result.data.pagination);
        } else {
            utils.showToast('获取党建知识列表失败', 'error');
            listContainer.innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
        }
    },
    
    renderKnowledgeList: function(knowledgeList, pagination) {
        const listContainer = document.getElementById('knowledgeList');
        const paginationContainer = document.getElementById('pagination');
        
        if (!knowledgeList || knowledgeList.length === 0) {
            listContainer.innerHTML = '<div class="empty">暂无党建知识内容</div>';
            paginationContainer.innerHTML = '';
            return;
        }
        
        listContainer.innerHTML = knowledgeList.map(knowledge => `
            <div class="content-item">
                <div class="content-header">
                    <h2 onclick="window.location.href='/party/knowledge/${knowledge.id}'">${knowledge.title}</h2>
                    ${currentUser && currentUser.role === 'admin' ? `
                        <button class="btn btn-danger btn-sm delete-btn" onclick="partyKnowledge.deleteKnowledge(${knowledge.id})">删除</button>
                    ` : ''}
                </div>
                <div class="meta">
                    <span>分类: ${knowledge.category}</span>
                    <span>作者: ${knowledge.author_name}</span>
                    <span>浏览量: ${knowledge.view_count}</span>
                    <span>发布时间: ${utils.formatDate(knowledge.created_at)}</span>
                    ${knowledge.status === 'pending' ? '<span class="status-badge pending">待审核</span>' : ''}
                    ${knowledge.status === 'rejected' ? '<span class="status-badge rejected">已拒绝</span>' : ''}
                </div>
            </div>
        `).join('');
        
        // 渲染分页
        this.renderPagination(pagination);
    },
    
    renderPagination: function(pagination) {
        const paginationContainer = document.getElementById('pagination');
        let html = '';
        
        if (pagination.pages > 1) {
            html = `
                <div class="pagination-controls">
                    <button ${this.currentPage === 1 ? 'disabled' : ''} onclick="partyKnowledge.goToPage(${this.currentPage - 1})" class="btn btn-sm">上一页</button>
                    <span>第 ${this.currentPage} 页，共 ${pagination.pages} 页</span>
                    <button ${this.currentPage === pagination.pages ? 'disabled' : ''} onclick="partyKnowledge.goToPage(${this.currentPage + 1})" class="btn btn-sm">下一页</button>
                </div>
            `;
        }
        
        paginationContainer.innerHTML = html;
    },
    
    goToPage: function(page) {
        this.currentPage = page;
        this.loadKnowledgeList();
    },
    
    deleteKnowledge: async function(knowledgeId) {
        if (!confirm('确定要删除这条党建知识吗？')) {
            return;
        }
        
        const result = await utils.api(`/api/party/knowledge/${knowledgeId}`, {
            method: 'DELETE'
        });
        
        if (result.code === 200) {
            utils.showToast('删除成功', 'success');
            this.loadKnowledgeList();
        } else {
            utils.showToast(result.message || '删除失败', 'error');
        }
    }
};

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', async function() {
    await auth.checkAuth();
    partyKnowledge.init();
});
</script>

<style>
.party-knowledge-page {
    max-width: 1000px;
    margin: 0 auto;
}

.page-title {
    color: var(--primary-red);
    margin-bottom: 30px;
    text-align: center;
}

.action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.category-filter {
    margin-bottom: 0;
}

.category-filter select {
    width: 200px;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 14px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
}

.empty {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
    background: #f9f9f9;
    border-radius: 8px;
    margin: 20px 0;
}

.pagination {
    margin-top: 30px;
    text-align: center;
}

.pagination-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.pagination-controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* 模态框样式 */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background-color: white;
    border-radius: 8px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
}

.modal-header h3 {
    margin: 0;
    color: var(--primary-red);
}

.close-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-light);
}

.close-btn:hover {
    color: var(--primary-red);
}

.modal-body {
    padding: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-row {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
}

.form-row .form-group {
    flex: 1;
    margin-bottom: 0;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: var(--text-dark);
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 14px;
}

.form-group textarea {
    resize: vertical;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 20px;
    border-top: 1px solid var(--border-color);
    background-color: #f9f9f9;
    border-radius: 0 0 8px 8px;
}

.alert {
    padding: 10px;
    border-radius: 4px;
    margin: 10px 0;
}

.alert-info {
    background-color: #e6f7ff;
    color: #1890ff;
    border: 1px solid #91d5ff;
}

/* 内容项样式 */
.content-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
}

.content-header h2 {
    color: var(--primary-red);
    margin: 0;
    font-size: 18px;
    cursor: pointer;
    flex: 1;
}

.delete-btn {
    margin-left: 10px;
}

.status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: bold;
}

.status-badge.pending {
    background: #fff7e6;
    color: #fa8c16;
}

.status-badge.rejected {
    background: #fff1f0;
    color: #ff4d4f;
}

.status-badge.approved {
    background: #f6ffed;
    color: #52c41a;
}
</style>
{% endblock %}
